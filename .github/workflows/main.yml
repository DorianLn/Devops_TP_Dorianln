name: CI devops 2025

 #  Déclenchement du workflow à chaque push ou pull request sur main et develop
on:
  push:
    branches:
      - main    # tu peux ajouter 'develop' si nécessaire
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
# Ce job s’exécute sur Ubuntu et teste l’application Java avec Maven
  test-backend:
    runs-on: ubuntu-24.04 # Environnement d'exécution (VM Linux)

    steps:
      # 1️⃣ Récupérer le code depuis GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installer Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # OpenJDK distribué par Eclipse Temurin
          java-version: '21'

      # 3️⃣ Build et test avec Maven
      - name: Build and test with Maven
        working-directory: backend/simpleapi # Répertoire où se trouve le pom.xml
        run: mvn clean verify   # Nettoie, compile et lance les tests
      
      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # fourni automatiquement
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}          # ton token SonarCloud 
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=DorianLn_Devops_TP_Dorianln -Dsonar.organization=dorianln -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ==============================
# 🐳 Job : build-and-push-docker-image   
# Objectif : construire les images Docker (backend, database, httpd)
# ==============================

  build-and-push-docker-image:
    needs: test-backend   # ce job ne démarre que si les tests passent
    runs-on: ubuntu-24.04 # machine virtuelle Ubuntu pour exécuter Docker

    steps:
      # 1️ Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️ Login Docker Hub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
  

      # 3 Construire l'image Docker du backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend            # chemin où se trouve le Dockerfile du backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api-backend:latest
          push: ${{ github.ref == 'refs/heads/main' }}   # push uniquement sur main

      # 4 Construire l'image Docker de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: .           # chemin vers ton Dockerfile de la base de données
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # 5 Construire l'image Docker du serveur HTTP
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: http-server       # chemin vers ton Dockerfile du HTTP server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}

