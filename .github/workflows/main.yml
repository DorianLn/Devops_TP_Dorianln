name: CI devops 2025

 #  Déclenchement du workflow à chaque push ou pull request sur main et develop
on:
  push:
    branches:
      - main    # tu peux ajouter 'develop' si nécessaire
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
# Ce job s’exécute sur Ubuntu et teste l’application Java avec Maven
  test-backend:
    runs-on: ubuntu-24.04 # Environnement d'exécution (VM Linux)

    steps:
      # 1️⃣ Récupérer le code depuis GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installer Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # OpenJDK distribué par Eclipse Temurin
          java-version: '21'

      # 3️⃣ Build et test avec Maven
      - name: Build and test with Maven
        working-directory: backend/simpleapi # Répertoire où se trouve le pom.xml
        run: mvn clean verify   # Nettoie, compile et lance les tests
