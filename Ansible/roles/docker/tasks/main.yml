    # 1️⃣ Installer les dépendances nécessaires à Docker
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-venv
        state: latest
        update_cache: yes

    # 2️⃣ Ajouter la clé GPG officielle de Docker
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    # 3️⃣ Ajouter le dépôt Docker à APT
    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: yes

    # 4️⃣ Installer Docker
    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    # 5️⃣ Installer Python3 et pip3
    - name: Install Python3 and pip3
      apt:
        name:
          - python3
          - python3-pip
        state: present

    # 6️⃣ Créer un environnement virtuel Python
    - name: Create a virtual environment for Docker SDK
      command: python3 -m venv /opt/docker_venv
      args:
        creates: /opt/docker_venv  # Évite de recréer le venv si déjà présent

    # 7️⃣ Installer le SDK Docker pour Python
    - name: Install Docker SDK for Python in virtual environment
      command: /opt/docker_venv/bin/pip install docker

    # 8️⃣ S’assurer que Docker est bien démarré
    - name: Make sure Docker is running
      service:
        name: docker
        state: started
      tags: docker
